# Sidekiq configuration
# See: https://github.com/sidekiq/sidekiq/wiki/Advanced-Options

# Default concurrency — overridden per environment below.
# Ensure the PostgreSQL connection pool (config/database.yml) is at
# least as large as the concurrency value.
:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 5) %>

# Environment-specific overrides
production:
  :concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 10) %>

staging:
  :concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 10) %>

:queues:
  - [default, 5]
  - [notifications, 4]
  - [schedules, 3]
  - [audit, 2]
  - [reports, 1]
